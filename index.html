<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Mixer - Spike S1/S2</title>
  <link rel="stylesheet" href="./node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <select id="command-select">
        <option value="pwsh.exe">pwsh</option>
        <option value="powershell.exe">Windows PowerShell</option>
        <option value="cmd.exe">cmd</option>
        <option value="claude">claude (Claude Code)</option>
        <option value="codex">codex</option>
      </select>
      <input type="text" id="cwd-input" placeholder="cwd (empty = home)">
      <button id="spawn8-btn">Spawn 8x (S2 memory test)</button>
      <div id="mem-display"></div>
    </div>
    <div id="tab-bar"><button id="new-tab-btn">+ New Terminal</button></div>
    <div id="terminal-container"></div>
  </div>
  <script src="./node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="./node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
