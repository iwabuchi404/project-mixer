<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; frame-src file: data:; object-src 'none'">
  <title>Project Mixer</title>
  <link rel="stylesheet" href="dist/xterm.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="scrollbars.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="title-bar">
    <span class="title-bar-mark">PM</span>
    <button id="app-menu-btn" title="Open menu" aria-label="Open application menu">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h10"/></svg>
    </button>
    <span id="title-bar-context"></span>
    <span id="title-bar-path"></span>
  </div>
  <div id="app">
    <div id="navigation-pane">
      <div id="sidebar-restore-bar" class="restore-bar hidden">
        <button id="sidebar-restore-btn" title="Restore Projects (Ctrl+B)">Projects &#x25BC;</button>
      </div>
      <div id="sidebar">
        <div id="sidebar-header">
          <span>Projects</span>
          <div class="header-actions">
            <button id="sidebar-collapse-btn" title="Collapse Projects">&#x25B2;</button>
            <button id="add-project-btn" title="Add Project">+</button>
          </div>
        </div>
        <div id="project-list"></div>
      </div>
      <div id="vsplitter-1" class="hsplitter"></div>
      <div id="file-tree-pane">
        <div id="file-tree-header">
          <span id="file-tree-title">Files</span>
          <div id="file-tree-actions">
            <button id="tree-collapse-btn" title="Collapse Files">&#x25BC;</button>
            <button id="tree-reload-btn" title="Reload">&#x21BB;</button>
            <button id="tree-new-file-btn" title="New File" aria-label="New File">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8.5 1.5h-5v13h9V6.5"/><path d="M8.5 1.5v5h5"/><path d="M4.5 10.5h5M7 8v5"/></svg>
            </button>
            <button id="tree-new-folder-btn" title="New Folder" aria-label="New Folder">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4h5l1.4 1.6h6.6V13h-13z"/><path d="M5.5 9h5M8 6.5v5"/></svg>
            </button>
          </div>
        </div>
        <div id="file-tree"></div>
      </div>
      <div id="file-tree-restore-bar" class="restore-bar hidden">
        <button id="file-tree-restore-btn" title="Restore Files (Ctrl+B)">Files &#x25B2;</button>
      </div>
    </div>
    <div id="vsplitter-2" class="vsplitter"></div>
    <div id="main-pane">
      <div id="main-tab-bar" class="tabbar" role="tablist" aria-label="Main views">
        <button id="new-tab-btn" class="tab-add" title="New terminal">+</button>
      </div>
      <div id="main-surface">
        <div id="terminal-pane" class="main-surface-pane">
          <div id="terminal-container"></div>
        </div>
        <div id="file-editor-pane" class="main-surface-pane hidden">
          <textarea id="file-editor-textarea" spellcheck="false" wrap="off"></textarea>
        </div>
        <div id="preview-pane" class="main-surface-pane hidden">
          <div id="preview-content">
            <webview id="preview-webview" partition="persist:preview" webpreferences="contextIsolation=yes,nodeIntegration=no,sandbox=yes"></webview>
          </div>
        </div>
      </div>
      <div id="splitter"></div>
      <div id="editor-pane">
        <div id="scratch-header">
          <span id="scratch-title">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 12.5h10M4 10l6.8-6.8 2 2L6 12H4z"/></svg>
            Scratch
          </span>
          <div id="scratch-actions">
            <span id="send-target">no terminal</span>
            <label id="push-focus-toggle" title="Append current file/selection context to the message">
              <input type="checkbox" id="push-focus-checkbox" checked>
              <span>context</span>
            </label>
            <button id="send-btn" title="Send to terminal (Ctrl+Enter)">Send</button>
            <button id="scratch-collapse-btn" title="Collapse Scratch" aria-label="Collapse Scratch" aria-expanded="true">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 10 4-4 4 4"/></svg>
            </button>
          </div>
        </div>
        <div id="editor-content">
          <textarea id="editor-textarea" spellcheck="false" wrap="off"></textarea>
        </div>
      </div>
    </div>
  </div>
  <div id="status-bar">
    <span id="status-left"></span>
    <span id="status-right-group">
      <span id="status-right"></span>
      <span id="status-system"></span>
    </span>
  </div>
  <div id="add-project-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Add Project</h3>
      <input type="text" id="project-name-input" placeholder="Project name">
      <div class="path-input-row">
        <input type="text" id="project-path-input" placeholder="Project path (e.g. D:\work\my-project)">
        <button id="browse-folder-btn" title="Browse...">...</button>
      </div>
      <div class="modal-buttons">
        <button id="project-cancel-btn">Cancel</button>
        <button id="project-confirm-btn">Add</button>
      </div>
    </div>
  </div>
  <div id="menu-backdrop" class="hidden"></div>
  <div id="new-tab-menu" class="dropdown-menu hidden"></div>
  <div id="context-menu" class="context-menu hidden">
    <div class="context-menu-item" data-action="preview">Open in Preview</div>
    <div class="context-menu-item" data-action="edit">Edit in Editor</div>
    <div class="context-menu-item" data-action="open-os">Open in OS</div>
    <div class="context-menu-item" data-action="open-explorer">Open in Explorer</div>
    <div class="context-menu-item" data-action="copy-path">Copy Path</div>
    <div class="context-menu-item" data-action="insert-path">Insert Path to Terminal</div>
    <div class="context-menu-item" data-action="insert-name">Insert Filename to Terminal</div>
    <div class="context-menu-item context-menu-danger" data-action="delete">Delete</div>
  </div>
  <div id="tab-context-menu" class="context-menu hidden"></div>
  <div id="preview-context-menu" class="context-menu hidden"></div>
  <div id="delete-confirm-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Delete File</h3>
      <p id="delete-confirm-message"></p>
      <div class="modal-buttons">
        <button id="delete-cancel-btn">Cancel</button>
        <button id="delete-confirm-btn" class="danger-btn">Delete</button>
      </div>
    </div>
  </div>
  <div id="prompt-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="prompt-title">New File</h3>
      <p id="prompt-label"></p>
      <input type="text" id="prompt-input" placeholder="name">
      <div class="modal-buttons">
        <button id="prompt-cancel-btn">Cancel</button>
        <button id="prompt-confirm-btn">OK</button>
      </div>
    </div>
  </div>
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="confirm-title">Confirm</h3>
      <p id="confirm-message"></p>
      <div class="modal-buttons">
        <button id="confirm-cancel-btn">Cancel</button>
        <button id="confirm-ok-btn">OK</button>
      </div>
    </div>
  </div>
  <div id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="error-region" aria-live="assertive"></div>
  <script src="dist/renderer.bundle.js"></script>
</body>
</html>
