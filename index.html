<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Mixer</title>
  <link rel="stylesheet" href="./node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-header">
        <span>Projects</span>
        <button id="add-project-btn" title="Add Project">+</button>
      </div>
      <div id="project-list"></div>
      <div id="sidebar-footer">
        <div id="mem-display"></div>
      </div>
    </div>
    <div id="file-tree-pane">
      <div id="file-tree-header">Files</div>
      <div id="file-tree"></div>
    </div>
    <div id="main-pane">
      <div id="tab-bar"><button id="new-tab-btn">+ New Terminal</button></div>
      <div id="terminal-container"></div>
    </div>
  </div>
  <div id="add-project-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Add Project</h3>
      <input type="text" id="project-name-input" placeholder="Project name">
      <input type="text" id="project-path-input" placeholder="Project path (e.g. D:\work\my-project)">
      <div class="modal-buttons">
        <button id="project-cancel-btn">Cancel</button>
        <button id="project-confirm-btn">Add</button>
      </div>
    </div>
  </div>
  <script src="./node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="./node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
